<section class="cta">
  <div class="container cta__box">
    <div class="cta__body">
      <h2>{{ title }}</h2>
      <p>{{ text }}</p>
    </div>
    <div class="cta__actions">
      <a routerLink="/contact" class="btn btn--primary">Contact Us</a>
      <a *ngIf="wa" [href]="wa" target="_blank" rel="noopener noreferrer" class="btn btn--wa">Chat on WhatsApp</a>
    </div>
  </div>
</section>
